<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성화중학교 얼티미트 인쇄 자료</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="print.css"><script src="print.js" defer></script></head><body><div class="print-toolbar"><a href="index.html#downloads">수업으로 돌아가기</a><button id="print-button">인쇄 / PDF로 저장</button><span>용지 A4 · 배율 100%</span></div><main id="pages"></main><template id="learning"><section class="sheet" data-kind="학습자료"><div class="print-header"><span>청주 성화중학교 · 1학년 체육</span><span>얼티미트 / 학습자료</span></div><div class="sheet-content"><p class="kicker">LESSON 01 · 교실 전략 수업 · 45분</p><h1>빈 공간을 찾아라!<br>우리 팀 얼티미트 작전</h1><div class="soft"><strong>오늘의 학습 목표</strong><ol><li>경기 상황에서 안전한 패스 대상을 고르고 이유를 설명한다.</li><li>빈 공간으로 이동하는 우리 팀의 공격 전략을 설계한다.</li><li>서로 다른 판정을 존중하며 해결하는 대화를 제안한다.</li></ol></div><h2>01. 좋은 작전은 규칙에서 시작된다</h2><div class="rule-grid"><div class="rule"><h3>1. 받으면, 멈추고</h3><p>달리며 잡았다면 가능한 한 빨리 멈춥니다. 멈춘 뒤에는 한 발을 축으로 두고 피벗하며 패스합니다.</p></div><div class="rule"><h3>2. 끝 구역에서 받으면 득점</h3><p>공격하는 엔드존 안에서 우리 팀의 패스를 잡으면 득점합니다. 엔드존 경계선 위에서 잡는 것은 득점이 아닙니다.</p></div><div class="rule"><h3>3. 실패하면 공격권 교대</h3><p>패스가 땅에 떨어지거나, 수비가 가로채거나, 경기장 밖에서 잡으면 공격권이 바뀝니다. 마지막 접촉 팀과 무관합니다.</p></div><div class="rule"><h3>4. 몸 대신, 공간으로</h3><p>신체 접촉을 피합니다. 상대가 든 디스크를 빼앗거나 상대의 이동 경로를 몸으로 막는 스크린을 하지 않습니다.</p></div><div class="rule"><h3>5. 10초는 수비의 카운트</h3><p>마커가 1초 간격으로 소리 내어 셉니다. ‘텐’의 첫소리가 나기 전에 던져야 합니다. 화면의 자동 타이머 규칙이 아닙니다.</p></div><div class="rule"><h3>6. 판정도 함께 책임지기</h3><p>선수들이 규칙을 지키고 판정합니다. 의견이 다르면 상황과 근거를 차분히 설명하고 규칙에 따라 재개합니다.</p></div></div><h2>02. 경기 전에 기억할 세 가지</h2><p><strong>패스 길</strong>이 열려 있는가? <strong>수비</strong>가 어디에 있는가? 내가 연결할 수 있는 <strong>거리</strong>인가?</p><p class="small">교실에서는 규칙과 전략을 탐구합니다. 패스·캐치 기능과 실제 안전한 경기 수행은 후속 실기 수업에서 확인합니다.</p></div><div class="page-footer"><span>빈 공간을 찾아라! · 우리 팀 얼티미트 작전</span><span>학습자료 1 / 2</span></div></section><section class="sheet" data-kind="학습자료"><div class="print-header"><span>청주 성화중학교 · 1학년 체육</span><span>얼티미트 / 학습자료</span></div><div class="sheet-content"><p class="kicker">READ THE SPACE</p><h1>패스 다음의 움직임까지.</h1><p>그림을 보고 A·B·C 중 패스할 대상을 선택하세요. 수비 위치와 패스 거리를 근거로 설명해 봅시다.</p><div class="court-wrap"><svg class="court" viewBox="0 0 600 270" role="img" aria-label="얼티미트 전술 코트"><rect class="line" x="2" y="2" width="596" height="266"/><rect class="zone" x="2" y="2" width="76" height="266"/><rect class="zone" x="522" y="2" width="76" height="266"/><text x="560" y="22" text-anchor="middle" font-size="10">공격 →</text><text x="560" y="39" text-anchor="middle" font-size="10">엔드존</text><circle class="attacker" cx="138" cy="189.0" r="17"/><text class="at" x="138" y="194.0" text-anchor="middle">나</text><circle class="attacker" cx="258" cy="191.70000000000002" r="17"/><text class="at" x="258" y="196.70000000000002" text-anchor="middle">A</text><circle class="attacker" cx="336" cy="70.2" r="17"/><text class="at" x="336" y="75.2" text-anchor="middle">B</text><circle class="attacker" cx="486" cy="156.60000000000002" r="17"/><text class="at" x="486" y="161.60000000000002" text-anchor="middle">C</text><rect class="defender" x="182" y="191.9" width="32" height="32"/><text class="dt" x="198" y="212.9" text-anchor="middle">①</text><rect class="defender" x="380" y="156.8" width="32" height="32"/><text class="dt" x="396" y="177.8" text-anchor="middle">②</text></svg></div><p class="legend">● 공격수 / □ 수비수 / 나: 디스크 소유자 / 공격 방향: 오른쪽</p><p class="small">교실 탐구용 4 대 2 정지 장면. 공식 경기 인원·경기장 비율을 나타내지 않습니다.</p><div class="columns"><div><h2>공간을 여는 세 행동</h2><ol><li>수비와 겹치지 않는 패스 길 찾기</li><li>받을 수 있는 빈 공간으로 이동하기</li><li>패스 후 다시 연결할 위치로 이동하기</li></ol></div><div><h2>서로를 존중하는 대화</h2><ol><li>내가 본 장면과 근거 설명하기</li><li>상대가 본 장면 끝까지 듣기</li><li>규칙을 확인하고 재개 방법 정하기</li></ol></div></div><h2>모둠 도전: 세 번의 패스로 연결하기</h2><p>공격수 4명과 수비수 2명을 배치하고 세 번의 패스로 엔드존에 연결하는 계획을 그립니다. 실선은 패스, 점선은 선수 이동으로 표시하고, 수비가 길을 막을 때의 대안도 준비하세요.</p><p class="small">위 인원과 패스 횟수는 전술 설계 과제의 조건이며 공식 경기 규칙이 아닙니다.</p><div class="source"><strong>근거 자료</strong><p>교육부 고시 제2022-33호 별책 11, 체육과 교육과정. [9체02-12], [9체02-26] 중심, [9체02-11] 복습 연결. 원문은 중등 성취기준 MCP로 확인(원문 PDF 35~36쪽).</p><p>WFDF 2025–2028 Basic Rules (한국어 요약)<br><a href="https://rules.wfdf.sport/wp-content/uploads/2025/03/WFDF-Rules-of-Ultimate-2025-2028-Basic-Version.pdf">https://rules.wfdf.sport/wp-content/uploads/2025/03/WFDF-Rules-of-Ultimate-2025-2028-Basic-Version.pdf</a></p></div></div><div class="page-footer"><span>빈 공간을 찾아라! · 우리 팀 얼티미트 작전</span><span>학습자료 2 / 2</span></div></section></template><template id="worksheet"><section class="sheet" data-kind="학생 활동지"><div class="print-header"><span>청주 성화중학교 · 1학년 체육</span><span>얼티미트 / 학생 활동지</span></div><div class="sheet-content"><p class="kicker">WORKSHEET 01 · 개인 판단 → 짝 설명</p><h1>나는 누구에게 패스할까?</h1><div class="identity">1학년 _____반 _____번 이름 _______________　 모둠 __________</div><h2>1. 첫 판단 · 5분</h2><p>아래 그림에서 나는 ( A / B / C )에게 패스하겠다. 그 이유는?</p><div class="answer-lines short"><span></span><span></span></div><h2>2. 규칙 챌린지 · 8분</h2><table class="quiz-table"><thead><tr><th>장면을 읽고 판단하세요.</th><th>내 판단</th></tr></thead><tbody><tr><td>1. 달리며 디스크를 잡았다. 그대로 세 걸음 더 달려 수비를 피한 뒤 던져도 된다.</td><td>O / X</td></tr><tr><td>2. 수비가 건드린 패스가 땅에 떨어져도 공격권이 바뀐다.</td><td>O / X</td></tr><tr><td>3. 엔드존 경계선 위에 발을 디디고 잡으면 득점이다.</td><td>O / X</td></tr><tr><td>4. 팀원이 패스를 받도록 수비의 이동 경로를 몸으로 막는 작전은 허용된다.</td><td>O / X</td></tr></tbody></table><p class="small">가장 헷갈린 문항 번호와 이유: ____________________________________________________</p><h2>3. 패스 길을 읽어라 · 12분</h2><div class="court-wrap"><svg class="court" viewBox="0 0 600 270" role="img" aria-label="얼티미트 전술 코트"><rect class="line" x="2" y="2" width="596" height="266"/><rect class="zone" x="2" y="2" width="76" height="266"/><rect class="zone" x="522" y="2" width="76" height="266"/><text x="560" y="22" text-anchor="middle" font-size="10">공격 →</text><text x="560" y="39" text-anchor="middle" font-size="10">엔드존</text><circle class="attacker" cx="138" cy="189.0" r="17"/><text class="at" x="138" y="194.0" text-anchor="middle">나</text><circle class="attacker" cx="258" cy="191.70000000000002" r="17"/><text class="at" x="258" y="196.70000000000002" text-anchor="middle">A</text><circle class="attacker" cx="336" cy="70.2" r="17"/><text class="at" x="336" y="75.2" text-anchor="middle">B</text><circle class="attacker" cx="486" cy="156.60000000000002" r="17"/><text class="at" x="486" y="161.60000000000002" text-anchor="middle">C</text><rect class="defender" x="182" y="191.9" width="32" height="32"/><text class="dt" x="198" y="212.9" text-anchor="middle">①</text><rect class="defender" x="380" y="156.8" width="32" height="32"/><text class="dt" x="396" y="177.8" text-anchor="middle">②</text></svg></div><p class="legend">● 공격수 / □ 수비수 / 나: 디스크 소유자. 공격 방향 →. 교실 탐구용 정지 장면.</p><p>다시 선택한 대상: ______　근거(수비 위치·거리·패스 길):</p><div class="answer-lines short"><span></span><span></span></div><p>패스한 뒤 나는 어디로 움직일까? _______________________________________________</p></div><div class="page-footer"><span>빈 공간을 찾아라! · 우리 팀 얼티미트 작전</span><span>학생 활동지 1 / 2</span></div></section><section class="sheet" data-kind="학생 활동지"><div class="print-header"><span>청주 성화중학교 · 1학년 체육</span><span>얼티미트 / 학생 활동지</span></div><div class="sheet-content"><p class="kicker">WORKSHEET 02 · 모둠 작전 → 개인 성찰</p><h1>우리 팀의 다음 선택.</h1><div class="identity">모둠 __________　내 역할: 전술 / 기록 / 발표 / 공정성 / 공간 관찰</div><h2>4. 세 번의 패스 작전 · 모둠 활동 12분</h2><p class="small">공격수 4명(○)·수비수 2명(□)을 배치하세요. 실선 화살표 = 패스, 점선 화살표 = 이동.<br>세 번의 패스로 엔드존까지 연결하세요. 인원·횟수는 이번 설계 과제 조건입니다.</p><div class="court-wrap"><svg class="court" viewBox="0 0 600 270" role="img" aria-label="얼티미트 전술 코트"><rect class="line" x="2" y="2" width="596" height="266"/><rect class="zone" x="2" y="2" width="76" height="266"/><rect class="zone" x="522" y="2" width="76" height="266"/><text x="560" y="22" text-anchor="middle" font-size="10">공격 →</text><text x="560" y="39" text-anchor="middle" font-size="10">엔드존</text></svg></div><p>수비가 패스 길을 막으면 우리는 어떻게 바꿀까?</p><div class="answer-lines short"><span></span><span></span></div><p class="small"><strong>갈등 상황:</strong> 우리 팀은 ‘잡기 전에 상대가 팔을 쳤어’라고 말하고, 상대는 ‘접촉하지 않았어’라고 말한다. 서로 소리를 높이기 시작했다.</p><p class="dialogue">나: “내가 본 상황은 ____________________________________________________.”<br>상대: “내가 본 상황은 __________________________________________________.”<br>함께: “규칙을 확인하고 ______________________________________ 다시 시작하자.”</p><h2>5. 자기평가와 퇴장 질문 · 8분</h2><table class="rubric"><tr><th>오늘의 나</th><th>스스로 가능</th><th>도움받아 가능</th><th>더 연습</th></tr><tr><td>패스 선택 이유를 설명했다.</td><td>□</td><td>□</td><td>□</td></tr><tr><td>이동과 대안 작전을 제안했다.</td><td>□</td><td>□</td><td>□</td></tr><tr><td>다른 의견을 듣고 존중했다.</td><td>□</td><td>□</td><td>□</td></tr></table><p>다음 실제 경기에서 실천할 공간 활용 전략 한 가지:</p><div class="answer-lines short"><span></span><span></span></div><p>다음 실제 경기에서 실천할 존중의 행동 한 가지:</p><div class="answer-lines short"><span></span><span></span></div></div><div class="page-footer"><span>빈 공간을 찾아라! · 우리 팀 얼티미트 작전</span><span>학생 활동지 2 / 2</span></div></section></template><template id="teacher"><section class="sheet" data-kind="교사용 해설"><div class="print-header"><span>청주 성화중학교 · 1학년 체육</span><span>얼티미트 / 교사용 해설</span></div><div class="sheet-content"><p class="kicker">TEACHER GUIDE · 학생에게 배부하지 않는 해설</p><h1>45분, 경기 판단을 배우다.</h1><p>대상: 청주 성화중학교 1학년 / 기본 패스·캐치 학습 후 교실 수업<br>준비: 교사 화면, 학생당 활동지 2쪽, 필기도구 / 4~5명 모둠</p><table class="flow"><tr><th>단계</th><th>시간</th><th>진행과 발문</th></tr><tr><td>경기를 읽다</td><td>5분</td><td>그림을 보고 개인 생각을 먼저 적게 합니다. 정답을 공개하지 않고 두 가지 의견을 받습니다.</td></tr><tr><td>규칙을 확인하다</td><td>8분</td><td>핵심 규칙을 3분간 확인하고, 4문항에 3분, 해설에 2분을 사용합니다.</td></tr><tr><td>빈 공간을 찾다</td><td>12분</td><td>개인 판단 3분 → 짝 설명 4분 → 패스 선택과 해설 비교 5분. 선택 이유를 먼저 묻습니다.</td></tr><tr><td>우리 팀을 설계하다</td><td>12분</td><td>4~5명 모둠으로 작전 설계 7분, 역할 대화 3분, 작전 수정 2분. 기록·발표·전술·공정성 역할을 나눕니다.</td></tr><tr><td>다음 경기를 준비하다</td><td>8분</td><td>두 모둠 발표 4분 → 자기평가 2분 → 퇴장 질문 2분. 승패보다 근거와 개선을 피드백합니다.</td></tr></table><h2>성취기준 연결</h2><p class="small"><strong>[9체02-12]</strong> 영역형 스포츠의 경기 방법을 이해하고 경기 전략을 활용하며 안전하게 경기한다.<br>→ 경기 방법과 전략을 탐구합니다. 실제 안전한 경기 수행은 후속 실기 수업에서 확인합니다.</p><p class="small"><strong>[9체02-26]</strong> 스포츠의 연습과 경기 과정에서 구성원 간에 서로 신뢰하며 팀 목표를 달성하기 위해 노력 하고 경기 예절을 갖추며 정정당당하게 참여한다.<br>→ 모둠의 의견을 듣고 존중하며 판정 대화를 연습합니다.</p><p class="small"><strong>[9체02-11]</strong> 영역형 스포츠의 수행 원리를 적용하여 경기 기능을 수행하고 향상한다.<br>→ 기본 패스·캐치 복습에 연결합니다. 이 교실 수업에서 경기 기능 수행을 평가하지 않습니다.</p><h2>규칙 챌린지 정답과 지도 초점</h2><p class="small"><strong>1. X</strong> 잡은 뒤에는 가능한 한 빨리 멈춰야 합니다. 의도적으로 더 달려 유리한 위치를 얻을 수 없습니다. 멈춘 뒤 피벗을 활용하세요.</p><p class="small"><strong>2. O</strong> 공격팀이 패스를 잡지 못하면 턴오버입니다. 수비가 마지막으로 건드렸다고 공격팀이 계속 소유하는 것은 아닙니다.</p><p class="small"><strong>3. X</strong> 경계선은 엔드존 안이 아닙니다. 다만 경기장 안에서 잡았다면 곧바로 턴오버가 되는 것은 아니며, 득점 없이 공격을 이어갈 수 있습니다.</p><p class="small"><strong>4. X</strong> 상대의 이동 경로를 막는 픽·스크린은 허용되지 않습니다. 몸으로 막는 대신 빈 공간으로 이동해 패스 길을 만드세요.</p><p class="small">성취기준 출처: 교육부 고시 제2022-33호 별책 11, PDF 35~36쪽. 중학교 1~3학년군 성취기준을 1학년 수업으로 재구성했습니다.</p></div><div class="page-footer"><span>빈 공간을 찾아라! · 우리 팀 얼티미트 작전</span><span>교사용 해설 1 / 2</span></div></section><section class="sheet" data-kind="교사용 해설"><div class="print-header"><span>청주 성화중학교 · 1학년 체육</span><span>얼티미트 / 교사용 해설</span></div><div class="sheet-content"><p class="kicker">FEEDBACK & ASSESSMENT</p><h1>선택보다, 선택의 근거.</h1><h2>전술판 예시 해설</h2><p class="small"><strong>가까운 A</strong> — 가능한 선택입니다. A까지 거리가 짧지만 수비 ①이 패스 길 가까이에 있습니다. 피벗으로 각도를 바꾸고 A가 옆으로 이동하면 더 안전해질 수 있습니다.</p><p class="small"><strong>빈 공간의 B</strong> — 이 정지 장면에서는 B가 유리합니다. 수비와 떨어져 있고 패스 길이 열려 있습니다. B가 디스크 쪽 빈 공간으로 움직이며 받으면 연결하기 좋습니다. 실제 경기에서는 수비의 이동과 패스 능력도 살펴야 합니다.</p><p class="small"><strong>앞쪽의 C</strong> — 득점 구역과 가깝지만 긴 패스이고 수비 ②가 길목에 있습니다. 바로 멀리 던지기보다 A나 B를 거쳐 수비 위치를 바꾸는 연결을 생각해 보세요.</p><p class="small">B만 정답으로 채점하지 않습니다. A를 고르더라도 수비 위치, 패스 각도, 거리, 동료 이동을 근거로 설명하면 타당한 판단으로 인정합니다.</p><h2>모둠 작전 예시</h2><p class="small">나 → 왼쪽 위 빈 공간으로 이동한 B → 가운데로 이동한 A → 오른쪽 엔드존으로 이동한 C. 패스 후 ‘나’는 뒤쪽 지원 공간으로 이동합니다. 수비가 B를 막으면 A로 짧게 연결하는 대안을 생각합니다. 예상 이동이므로 수비 반응에 따라 수정해야 합니다.</p><h2>판정 대화 예시</h2><div class="soft small">“잡기 전에 내 팔에 접촉이 있었다고 봤어.”<br>“나는 접촉하지 않았다고 느꼈어. 네 설명을 들어 볼게.”<br>“서로 다르게 봤구나. 규칙을 확인하자. 이 장면에서는 이전 던진 선수에게 디스크를 돌려주고 체크 후 재개하자.”</div><p class="small">이는 동의하지 않는 파울 판정의 일반적인 재개 예시입니다. 모든 파울에 일괄 적용하지 않고 상황별 규칙을 확인합니다. 학생 역할 대화에서는 관점 설명·경청·규칙 근거를 관찰합니다.</p><h2>형성평가 관찰 기준</h2><table class="rubric"><tr><th>관찰 요소</th><th>도달 모습</th><th>도움이 필요할 때의 발문</th></tr><tr><td>전략 판단</td><td>수비 위치·패스 길·거리 중 2가지 이상으로 설명</td><td>“패스 길에 누가 있나요?”</td></tr><tr><td>작전 설계</td><td>패스·이동을 구분하고 수비 반응에 대한 대안 제시</td><td>“그 길이 막히면 어디가 열릴까요?”</td></tr><tr><td>협력·존중</td><td>상대 의견을 듣고 상황과 규칙을 근거로 대화</td><td>“상대가 본 장면을 다시 말해 볼까요?”</td></tr></table><p class="small">이번 수업은 형성평가입니다. 승패·투척 거리·캐치 성공률을 평가하지 않습니다. 다음 실기 수업에서 전략 적용과 안전한 경기 수행을 추가로 관찰하세요.</p><div class="source"><strong>규칙 근거:</strong> WFDF 2025–2028 Basic Rules.<br><a href="https://rules.wfdf.sport/wp-content/uploads/2025/03/WFDF-Rules-of-Ultimate-2025-2028-Basic-Version.pdf">https://rules.wfdf.sport/wp-content/uploads/2025/03/WFDF-Rules-of-Ultimate-2025-2028-Basic-Version.pdf</a></div></div><div class="page-footer"><span>빈 공간을 찾아라! · 우리 팀 얼티미트 작전</span><span>교사용 해설 2 / 2</span></div></section></template></body></html>
